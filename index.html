/* Layout: one-column phone app. Header, scrolling view, fixed bottom tab bar, slide-up sheets for forms.
   Look: shipping-label type (condensed caps + mono quantities) on cool grey, deep teal ink, signal orange for low stock. */
:root{
  --bg:#eaf1ff; --surface:#ffffff; --ink:#0a1633; --mute:#4a5c82; --line:#cfdcf2;
  --accent:#1f5fe0; --accent-ink:#ffffff; --alert:#c2570c; --ok:#15803d; --wash:#dde8fb;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#050b24; --surface:#0c1a45; --ink:#e8f0ff; --mute:#9db2dd; --line:#1c3270;
  --accent:#ffc247; --accent-ink:#1a1200; --alert:#ff9a4d; --ok:#4ade80; --wash:#102259; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#050b24; --surface:#0c1a45; --ink:#e8f0ff; --mute:#9db2dd; --line:#1c3270;
  --accent:#ffc247; --accent-ink:#1a1200; --alert:#ff9a4d; --ok:#4ade80; --wash:#102259; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:16px/1.4 var(--body);padding-inline:16px;padding-block:0 96px;-webkit-text-size-adjust:100%}
.app{max-width:560px;margin-inline:auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button,a,input,select,textarea,label{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.sheet{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
/* iPhone: paint the strip behind the clock and battery, keep date and time fields the same height as the others, never zoom into fields */
body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:#050b24;z-index:50;pointer-events:none}
.tabs{padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
@supports (-webkit-touch-callout:none){input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;display:block;min-width:0;min-height:46px;line-height:46px;text-align:left}input,select,textarea{font-size:16px}}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;font-family:var(--display);font-weight:700;letter-spacing:.02em;text-wrap:balance}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.label{font:600 12px/1 var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--mute)}

header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 10px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
header.top h1{font-size:28px;text-transform:uppercase;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.iconbtn svg,.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--wash);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:14px;color:var(--mute)}
.banner button{background:none;border:0;color:var(--accent);font-weight:600;padding:6px 0}

.btn{min-height:46px;padding:0 18px;border-radius:12px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:600}

.btn.warn{background:transparent;color:var(--alert);border-color:var(--alert)}
.btn.sm{min-height:38px;padding:0 14px;font-size:14px}
.btn.block{width:100%}
.sug{border:1px solid var(--line);border-radius:12px;background:var(--card,#fff);margin:-6px 0 12px;overflow:hidden}

.sug .sugi:last-child{border-bottom:0}.sug .sugi:active{background:var(--wash)}
.sug .sn{font-weight:600;min-width:0;overflow-wrap:anywhere}.sug .ss{flex:none;font-size:13px;color:var(--mute)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1;min-width:0}
.order .row>.btn{flex:1 1 calc(50% - 5px);min-width:0;padding:6px 8px;line-height:1.2;white-space:normal;text-align:center;overflow-wrap:anywhere}
.xgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.xgrid .btn{min-height:46px;padding:4px 3px;font-size:12.5px;font-weight:600;line-height:1.15;white-space:normal;text-align:center;overflow-wrap:normal;word-break:normal;hyphens:none;letter-spacing:-.01em}

.hero{padding:6px 0 18px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-block:1px solid var(--line);margin-bottom:22px}
.stats div{padding:12px 0;min-width:0}
.stats div+div{padding-left:14px;border-left:1px solid var(--line)}
.stats b{display:block;font:600 20px/1.2 var(--mono);margin-top:6px;overflow-wrap:anywhere}

section.block{margin-bottom:26px}
.block>.head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.block>.head h2{font-size:22px;text-transform:uppercase}

.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.item{display:flex;gap:12px;align-items:center;justify-content:space-between;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:13px 14px;min-height:60px}
.item:first-child{border-top:0}
.item .main{min-width:0;flex:1}
.item .name{font-weight:600;overflow-wrap:anywhere}
.item .sub{font-size:13px;color:var(--mute);overflow-wrap:anywhere}
.qty{font:600 24px/1 var(--mono);text-align:right;flex:none}
.qty small{display:block;font:500 11px/1.4 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.qty.low{color:var(--alert)}
#lock{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}#lock .box{width:100%;max-width:340px;text-align:center}
#expired{position:fixed;inset:0;z-index:70;overflow:auto;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(110% 70% at 85% 0%,#1f5fe0 0%,#0a2370 40%,#050b24 78%);color:#fff}#expired[hidden]{display:none}#expired .box{width:100%;max-width:360px;text-align:center;margin:auto}#expired textarea{font:14px var(--mono);margin:10px 0 6px;color:#14213d;background:#fff;-webkit-text-fill-color:#14213d;border:2px solid #fca311;text-align:left}#expired textarea::placeholder{color:#6b7280;-webkit-text-fill-color:#6b7280}#expired .dev{font:600 30px var(--mono);letter-spacing:2px;margin:6px 0 12px;user-select:all;-webkit-user-select:all}#expired .err{color:#ffb4a8;min-height:18px}#expired .btn.ghost{color:#fff;border-color:rgba(255,255,255,.55);background:transparent}
body.expired .app,body.expired .tabs,body.expired header.top,body.expired #overlay,body.expired #toast{display:none!important}
#lock input{text-align:center;font:600 28px var(--mono);letter-spacing:.3em;margin:14px 0 8px}
body.locked .app,body.locked .tabs,body.locked #overlay,body.locked #toast{display:none!important}
.line2{display:flex;gap:8px;align-items:center;margin-bottom:8px}.line2 input{flex:1;margin:0}.line2 .sub{white-space:nowrap}
.line .lexpw{grid-column:1/-1;margin:0}
.tag{display:inline-block;font:600 11px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;padding:4px 7px;border-radius:6px;border:1px solid currentColor}
.tag.low{color:var(--alert)} .tag.completed{color:var(--ok)} .tag.draft{color:var(--mute)} .tag.cancelled{color:var(--mute);opacity:.7}
.empty{padding:26px 16px;text-align:center;color:var(--mute)}
.pos{color:var(--ok)} .neg{color:var(--alert)}

.tools{display:flex;gap:8px;margin-bottom:12px}
.tools input{flex:1;min-width:0}
@media (max-width:400px){.tools{flex-wrap:wrap}.tools input{flex:1 1 100%}.tools .btn{flex:1}}
.grph{display:flex;align-items:center;gap:8px;background:var(--bg);border-top:1px solid var(--line);padding:4px 8px 4px 14px}.grph .gh{flex:1;min-width:0;display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;background:none;border:0;padding:8px 0;font-size:13px;color:var(--mute)}.grph b{color:var(--ink);font-size:14px;overflow-wrap:anywhere}.grph .btn{flex:none;padding-inline:10px}
@media (max-width:400px){.grph{flex-wrap:wrap;padding-right:14px}.grph .gh{flex:1 1 100%;padding-bottom:0}.grph .btn{margin:0 0 8px auto}}
.vhead,.vrow{display:grid;grid-template-columns:1fr 1.1fr 64px;gap:8px;align-items:center}.vhead{font:600 11px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);padding:6px 0}.vrow{padding:7px 0;border-top:1px solid var(--line)}.vrow input{min-width:0;padding-inline:8px}.vrow b{font-size:14px;overflow-wrap:anywhere}
.camov{position:fixed;inset:0;z-index:55;background:#000;color:#fff;display:flex;flex-direction:column}.camtop{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px}.camvid{position:relative;flex:1;min-height:0;overflow:hidden}.camvid video{width:100%;height:100%;object-fit:cover;background:#000}.camguide{position:absolute;left:8%;right:8%;top:50%;height:34%;transform:translateY(-50%);border:2px solid #ffc247;border-radius:14px;box-shadow:0 0 0 9999px rgba(0,0,0,.38);pointer-events:none}.camfoot{padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));text-align:center}.cammsg{min-height:44px;font-size:15px;margin-bottom:8px;overflow-wrap:anywhere}.cammsg.ok{color:#7dffb0}.cammsg.bad{color:#ff9d9d}
input,select{width:100%;min-height:46px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
label{display:block;font-size:13px;color:var(--mute);margin-bottom:12px}
label input,label select{margin-top:5px;color:var(--ink)}
.chips{display:flex;gap:8px;margin-bottom:12px}
.chips.scroll{overflow-x:auto;flex-wrap:nowrap;padding-bottom:2px}.chips.scroll .chip{flex:none}
.thumb{width:44px;height:44px;border-radius:10px;object-fit:cover;flex:none;background:var(--wash)}
.photorow{display:flex;gap:10px;align-items:center;margin:0 0 12px}.photorow .pimg{width:64px;height:64px;border-radius:12px;object-fit:cover;background:var(--wash);border:1px solid var(--line);flex:none}
.chip{min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.order{padding:14px;border-top:1px solid var(--line)}
.order:first-child{border-top:0}
.order .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.order .lines{font-size:14px;color:var(--mute);margin:6px 0 10px;overflow-wrap:anywhere}

.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:6}
.tabs button{flex:1;min-width:0;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--mute);font-size:12px;font-weight:500}
.tabs button.on{color:var(--accent)}

.scrim{position:fixed;inset:0;background:rgba(5,12,12,.5);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet .hd{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.sheet h2{font-size:26px;text-transform:uppercase;overflow-wrap:anywhere}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.line,.svcrow,.adrow{display:grid;grid-template-columns:1fr 64px 84px 40px;gap:6px;margin-bottom:8px;align-items:center}
.line select,.line input,.svcrow input,.adrow select,.adrow input{min-height:44px;padding:0 8px;margin:0}
.adrow .adn{font-weight:600;line-height:1.25;word-break:break-word}.adrow .adn small{display:block;font-weight:400;color:var(--mute)}
.adrow button{min-height:44px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--alert)}
.line button,.svcrow button{min-height:44px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--alert)}
.line button{min-height:44px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--alert)}
.err{color:var(--alert);font-size:14px;min-height:20px;margin-bottom:6px}
textarea{width:100%;min-height:96px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:10px;font:16px/1.4 var(--mono)}
.sep{height:1px;background:var(--line);margin:18px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:20;max-width:90%;text-align:center}
.cobtn{display:flex;align-items:center;gap:6px;max-width:100%;min-width:0;background:none;border:0;padding:6px 0;font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit}

.bars{display:flex;align-items:flex-end;gap:2px;height:110px;border-bottom:1px solid var(--line);padding-top:6px}

.tabs button{font-size:11px}

.hint{font-size:13px;color:var(--mute);margin:10px 0 0}

.actions>*{flex:1;min-width:0}
.pick input[type=checkbox]{width:24px;height:24px;min-height:24px;flex:none;accent-color:var(--accent)}
.copies{width:64px;min-height:42px;text-align:center;flex:none;padding:0 6px}
.bcprev{display:flex;justify-content:center;margin:0 0 12px}
.bcprev canvas{max-width:100%;height:auto;border-radius:6px;border:1px solid var(--line)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
/* Golden Gates look: deep space navy, electric blue, sunrise gold */

  Object.assign(FR, {"Sync server address": "Adresse du serveur de synchronisation", "Save server": "Enregistrer le serveur", "Remove server": "Retirer le serveur", "I have an invite": "J'ai une invitation", "Checking…": "Vérification…", "To keep several phones in step, add the address of your sync server (a free Firebase Realtime Database). Inside Claude, sync works without a server.": "Pour garder plusieurs téléphones à jour, ajoutez l'adresse de votre serveur de synchronisation (une base Firebase Realtime Database gratuite). Dans Claude, la synchronisation fonctionne sans serveur.", "Your data is locked with a key on your phones before it is sent, so the server cannot read it.": "Vos données sont verrouillées par une clé sur vos téléphones avant l'envoi, le serveur ne peut donc pas les lire.", "Send invite on WhatsApp": "Envoyer l'invitation sur WhatsApp", "Copy invite": "Copier l'invitation", "Invite copied": "Invitation copiée", "This company is shared. To add another phone, send it the invite below, then on that phone open Settings and tap I have an invite.": "Cette entreprise est partagée. Pour ajouter un autre téléphone, envoyez-lui l'invitation ci-dessous, puis sur ce téléphone ouvrez les réglages et touchez J'ai une invitation.", "Anyone with the invite can read and change this company, so send it only to people you trust.": "Toute personne ayant l'invitation peut lire et modifier cette entreprise, envoyez-la donc seulement à des personnes de confiance.", "Enter the server address, like https://your-project-default-rtdb.firebaseio.com": "Saisissez l'adresse du serveur, comme https://votre-projet-default-rtdb.firebaseio.com", "The server refused. Check its rules.": "Le serveur a refusé. Vérifiez ses règles.", "Could not reach the server. Check the address and your internet.": "Impossible de joindre le serveur. Vérifiez l'adresse et votre internet.", "Sync server saved": "Serveur de synchronisation enregistré", "Remove the sync server?": "Retirer le serveur de synchronisation ?", "Companies that sync through it keep their data on this phone but stop syncing until a server is added again.": "Les entreprises synchronisées par ce serveur gardent leurs données sur ce téléphone mais ne se synchronisent plus tant qu'un serveur n'est pas ajouté.", "Remove": "Retirer", "Copying is blocked here. Try WhatsApp.": "La copie est bloquée ici. Essayez WhatsApp.", "Paste the whole invite message you received. This phone then keeps its own copy of that company and stays in step with it.": "Collez tout le message d'invitation reçu. Ce téléphone garde alors sa propre copie de l'entreprise et reste à jour avec elle.", "Invite": "Invitation", "Add company": "Ajouter l'entreprise", "That is not a valid invite. Paste the whole message.": "Ce n'est pas une invitation valide. Collez tout le message.", "This company is already on this phone.": "Cette entreprise est déjà sur ce téléphone.", "This invite is for a different sync server. Change the server in Settings first.": "Cette invitation est pour un autre serveur. Changez d'abord le serveur dans les réglages.", "No company was found for this invite.": "Aucune entreprise trouvée pour cette invitation.", "The key in this invite does not match. Ask for a new invite.": "La clé de cette invitation ne correspond pas. Demandez une nouvelle invitation.", "The sync server refused this. Check the server address and its rules.": "Le serveur de synchronisation a refusé. Vérifiez son adresse et ses règles.", "This phone's invite does not match the shared data. Ask for a new invite.": "L'invitation de ce téléphone ne correspond pas aux données partagées. Demandez une nouvelle invitation.", "This company was synced another way. Stop syncing it and turn sync on again to use the sync server.": "Cette entreprise était synchronisée autrement. Arrêtez sa synchronisation et réactivez-la pour utiliser le serveur."});
  Object.assign(FR, {"How to set up the sync server": "Comment configurer le serveur de synchronisation", "One free Firebase database keeps all your phones in step, with or without Claude. It takes about 5 minutes. Do it once, on any phone or computer.": "Une base Firebase gratuite garde tous vos téléphones à jour, avec ou sans Claude. Cela prend environ 5 minutes. À faire une seule fois, sur un téléphone ou un ordinateur.", "Rules to paste": "Règles à coller", "Copy the rules": "Copier les règles", "Rules copied": "Règles copiées", "Copying is blocked here. Select the rules and copy them by hand.": "La copie est bloquée ici. Sélectionnez les règles et copiez-les à la main.", "Your data is locked with a key that stays on your phones before it is sent, so the server only holds unreadable text. Use the same server address on every phone.": "Vos données sont verrouillées par une clé qui reste sur vos téléphones avant l'envoi, le serveur ne contient donc que du texte illisible. Utilisez la même adresse de serveur sur tous les téléphones.", "Open console.firebase.google.com and sign in with a Google account.": "Ouvrez console.firebase.google.com et connectez-vous avec un compte Google.", "Tap Create a project, give it a name, and switch Google Analytics off.": "Touchez Create a project, donnez-lui un nom et désactivez Google Analytics.", "In the menu choose Build, then Realtime Database, then Create Database. Pick the location closest to you and start in locked mode.": "Dans le menu choisissez Build, puis Realtime Database, puis Create Database. Choisissez l'emplacement le plus proche et démarrez en mode verrouillé (locked mode).", "Open the Rules tab, delete what is there, paste the rules below, then tap Publish.": "Ouvrez l'onglet Rules, supprimez ce qui s'y trouve, collez les règles ci-dessous, puis touchez Publish.", "Open the Data tab and copy the address at the top. It looks like https://your-project-default-rtdb.firebaseio.com": "Ouvrez l'onglet Data et copiez l'adresse en haut. Elle ressemble à https://your-project-default-rtdb.firebaseio.com", "Come back here, paste it in Sync server address and tap Save server.": "Revenez ici, collez-la dans Adresse du serveur de synchronisation et touchez Enregistrer le serveur.", "Tap Turn on sync, then Send invite on WhatsApp. On the other phone tap I have an invite and paste it.": "Touchez Activer la synchronisation, puis Envoyer l'invitation sur WhatsApp. Sur l'autre téléphone touchez J'ai une invitation et collez-la."});
  Object.assign(FR, {"User manual": "Mode d'emploi", "New here? Read the short user manual.": "Nouveau ici ? Lisez le court mode d'emploi.", "What this app is": "À quoi sert cette application", "Golden Gates Stock Inventory is a record-keeping system for people who want to travel abroad and for business owners. You enter your business stock, sales, purchases, debts and expenses, and the app keeps your accounts. Over time it builds a clear and credible financial history.": "Golden Gates Stock Inventory est un système de tenue de comptes pour les personnes qui veulent voyager à l'étranger et pour les chefs d'entreprise. Vous saisissez votre stock, vos ventes, achats, dettes et dépenses, et l'application tient vos comptes. Avec le temps, elle construit un historique financier clair et crédible.", "For people applying for a visa": "Pour une demande de visa", "Embassies look for a business that is real, active and steady over many months. Daily records with real dates, sales, expenses and profit reports give you organised proof of your activity. Save the PDF reports and bring them with your bank statements and business papers.": "Les ambassades cherchent une activité réelle, active et régulière sur plusieurs mois. Des enregistrements quotidiens avec les vraies dates, des ventes, des dépenses et des rapports de bénéfice vous donnent une preuve organisée de votre activité. Enregistrez les rapports PDF et apportez-les avec vos relevés bancaires et vos papiers d'entreprise.", "Record only what really happened. True and regular records are what make a history credible. They do not replace the documents an embassy asks for.": "N'enregistrez que ce qui s'est vraiment passé. Ce sont des enregistrements vrais et réguliers qui rendent un historique crédible. Ils ne remplacent pas les documents demandés par une ambassade.", "For business owners": "Pour les chefs d'entreprise", "Use it every day to know what you have in stock, what you sold, who owes you and what you earned. It works on your phone, even with no internet.": "Utilisez-la chaque jour pour savoir ce que vous avez en stock, ce que vous avez vendu, qui vous doit de l'argent et ce que vous avez gagné. Elle fonctionne sur votre téléphone, même sans internet.", "Getting started": "Pour commencer", "Open Settings and enter your business name, town, currency, address and logo.": "Ouvrez les réglages et saisissez le nom de votre entreprise, la ville, la devise, l'adresse et le logo.", "In Stock, add your items with their cost, selling price and the quantity you have.": "Dans Stock, ajoutez vos articles avec leur coût, leur prix de vente et la quantité que vous avez.", "When you sell or buy, open Orders, tap New sale or New purchase, and complete it. Stock and profit update by themselves.": "Quand vous vendez ou achetez, ouvrez Commandes, touchez Nouvelle vente ou Nouvel achat, puis terminez-la. Le stock et le bénéfice se mettent à jour tout seuls.", "Record what you spend under Reports, Expenses, and other money you receive under Other income.": "Enregistrez vos dépenses dans Rapports, Dépenses, et les autres sommes reçues dans Autres revenus.", "If a customer pays later, record each payment in Orders. The list Customers owe you shows what is still unpaid.": "Si un client paie plus tard, enregistrez chaque paiement dans Commandes. La liste Les clients vous doivent montre ce qui reste à payer.", "Every day": "Chaque jour", "Record every sale and purchase on the day it happens, with the real date. Count your cash at closing in the Cash drawer. Look at the Overview page to see your stock and your profit.": "Enregistrez chaque vente et chaque achat le jour même, avec la vraie date. Comptez votre caisse à la fermeture. Consultez la page Aperçu pour voir votre stock et votre bénéfice.", "Reports and proof": "Rapports et preuves", "In Reports, choose a period, for example the last 6 or 12 months, and save the Sales report, Expenses, Other income, Invoices and Cash drawer as a PDF or an Excel file. Use Invoices when a customer needs a formal bill.": "Dans Rapports, choisissez une période, par exemple les 6 ou 12 derniers mois, et enregistrez le rapport des ventes, les dépenses, les autres revenus, les factures et la caisse en PDF ou en fichier Excel. Utilisez les factures quand un client a besoin d'une facture officielle.", "Keep your records safe": "Gardez vos données en sécurité", "Save a PDF backup every week in Settings, Backup. Set a PIN so nobody else can open the app. To use several phones, turn on sync. Your data stays on your phone.": "Faites une sauvegarde PDF chaque semaine dans Réglages, Sauvegarde. Définissez un PIN pour que personne d'autre n'ouvre l'application. Pour utiliser plusieurs téléphones, activez la synchronisation. Vos données restent sur votre téléphone.", "Need help?": "Besoin d'aide ?", "Write or call on WhatsApp:": "Écrivez ou appelez sur WhatsApp :"});
  Object.assign(FR, {"Item with variants": "Article à variantes", "variant": "variante", "variants": "variantes", "Variants": "Variantes", "Variant": "Variante", "Group": "Groupe", "Group name (the shared item name)": "Nom du groupe (nom commun de l'article)", "Rename group": "Renommer le groupe", "Group renamed": "Groupe renommé", "Variant name of this item (e.g. Red / L)": "Nom de variante de cet article (ex. Rouge / L)", "Add more variants": "Ajouter des variantes", "First option, separated by commas (e.g. S, M, L)": "Première option, séparée par des virgules (ex. S, M, L)", "Second option (optional), e.g. Red, Blue": "Deuxième option (facultatif), ex. Rouge, Bleu", "Show the variants": "Afficher les variantes", "Enter the options, for example S, M, L.": "Saisissez les options, par exemple S, M, L.", "That makes more than 60 variants. Use fewer options.": "Cela fait plus de 60 variantes. Utilisez moins d'options.", "All of these variants already exist.": "Toutes ces variantes existent déjà.", "Enter the variant name of this item.": "Saisissez le nom de variante de cet article.", "Every variant needs a SKU.": "Chaque variante a besoin d'une référence (SKU).", "Two variants have the same SKU.": "Deux variantes ont la même référence (SKU).", "Variants added": "Variantes ajoutées", "Clear the group to make this a normal item.": "Videz le groupe pour en faire un article normal.", "Turn into variants": "Transformer en variantes", "All variants of": "Toutes les variantes de", "Scan items": "Scanner des articles", "Find an item": "Trouver un article", "Scan with camera": "Scanner avec la caméra", "Scan": "Scanner", "Scan a barcode": "Scanner un code-barres", "Light": "Lampe", "Take a photo instead": "Prendre une photo à la place", "Starting the camera...": "Démarrage de la caméra...", "Point the camera at a barcode": "Dirigez la caméra vers un code-barres", "The camera is not available here.": "La caméra n'est pas disponible ici.", "The camera could not be opened.": "Imp   Object.assign(FR, {"Proforma invoice": "Facture proforma", "Valid for 30 days. Goods are released after payment.": "Valable 30 jours. Les marchandises sont remises après paiement.", "Payment received": "Paiement reçu", "Amount received": "Montant reçu", "Saving takes the stock out and records this payment. If you enter less than the total, the rest stays owing.": "L'enregistrement sort le stock et note ce paiement. Si vous saisissez moins que le total, le reste reste dû.", "Save payment and take stock out": "Enregistrer le paiement et sortir le stock", "Payment saved, stock taken out": "Paiement enregistré, stock sorti"});

  Object.assign(FR, {"Adjust": "Modifier", "Adjust sale": "Modifier la vente", "Change what was sold. The stock follows: items taken off go back in, extra items come out. Payments are kept.": "Modifiez ce qui a été vendu. Le stock suit : les articles retirés y retournent, les articles en plus en sortent. Les paiements sont conservés.", "Add an item": "Ajouter un article", "Reason (optional)": "Motif (facultatif)", "New total": "Nouveau total", "Money to give back": "Argent à rendre", "Save changes": "Enregistrer les changements", "Changes so far": "Changements déjà faits", "Sale adjusted": "Vente modifiée", "e.g. client added labour": "ex. le client a ajouté de la main-d'œuvre", "Keep at least one item or service. To cancel the whole sale, use Return items.": "Gardez au moins un article ou un service. Pour annuler toute la vente, utilisez Retourner des articles.", "Check each item: a quantity of 0 or more and a valid price.": "Vérifiez chaque article : une quantité de 0 ou plus et un prix valide.", "Check each new item: a quantity above 0 and a valid price.": "Vérifiez chaque nouvel article : une quantité supérieure à 0 et un prix valide."});

  Object.assign(FR, {"Use this app honestly": "Utilisez cette application honnêtement", "I understand": "J'ai compris", "Honest use": "Utilisation honnête", "Golden Gates Stock Inventory is made to help you keep a true record of your business.": "Golden Gates Stock Inventory est conçue pour vous aider à tenir un registre fidèle de votre activité.", "Enter only real items, real sales, real prices and real payments. Do not invent, change or backdate records to make a business look bigger, older or more active than it is.": "Saisissez uniquement de vrais articles, de vraies ventes, de vrais prix et de vrais paiements. N'inventez pas, ne modifiez pas et n'antidatez pas des écritures pour faire paraître une activité plus grande, plus ancienne ou plus active qu'elle ne l'est.", "Records made up to support a visa, a loan or any official application can lead to refusal, a ban or legal action. Keep your real receipts and your bank or mobile money statements, and be ready to show them.": "Des écritures fabriquées pour appuyer une demande de visa, un prêt ou toute démarche officielle peuvent conduire à un refus, à une interdiction ou à des poursuites. Gardez vos vrais reçus et vos relevés bancaires ou de mobile money, et soyez prêt à les présenter.", "Honest records protect you and strengthen your application. The seller is not responsible for false or misleading use of the app.": "Des écritures honnêtes vous protègent et renforcent votre dossier. Le vendeur n'est pas responsable d'un usage faux ou trompeur de l'application."});
  Object.assign(FR, {"Referral bonus: 20%": "Bonus de parrainage : 20 %", "Your referral code is": "Votre code de parrainage est", "and it is inside the message. When a friend buys a licence and gives your code to the seller, you get a bonus of 20% of what they buy. You choose: extra time on your licence, or cash. Ask your seller for it.": "et il est dans le message. Quand un ami achète une licence et donne votre code au vendeur, vous recevez un bonus de 20 % de son achat. Vous choisissez : du temps en plus sur votre licence, ou de l'argent. Demandez-le à votre vendeur.", "Referral code (optional, from the friend who shared the app)": "Code de parrainage (facultatif, de l'ami qui vous a partagé l'application)"});
  Object.assign(FR, {"Jobs abroad and some schools": "Emplois à l'étranger et quelques écoles", "Open the guide to jobs and schools abroad. It opens in your browser and needs internet.": "Ouvrez le guide des emplois et des écoles à l'étranger. Il s'ouvre dans votre navigateur et demande internet."});

  Object.assign(FR, {"Your licence has ended": "Votre licence est terminée", "Your records are safe on this phone. Send this phone code to your seller to renew.": "Vos données sont en sécurité sur ce téléphone. Envoyez ce code téléphone à votre vendeur pour renouveler.", "Save a copy of my data": "Enregistrer une copie de mes données", "Your data belongs to you. You can always save a copy of it here.": "Vos données vous appartiennent. Vous pouvez toujours en enregistrer une copie ici."});
  Object.assign(FR, {"Saved services": "Services enregistrés", "Services you charge for, with their usual price. When you make a sale, tap one to add it. Services you use on a sale are remembered here too.": "Les services que vous facturez, avec leur prix habituel. Lors d'une vente, touchez-en un pour l'ajouter. Les services utilisés dans une vente sont aussi retenus ici.", "Each service needs a different name and a price of 0 or more.": "Chaque service doit avoir un nom différent et un prix de 0 ou plus.", "Add a service": "Ajouter un service"});

  /* shrinks the chosen picture to at most 200 px and keeps it as a small PNG inside this company's data */
  /* item photo: a small square JPEG (about 3 KB) so hundreds of items still fit in the browser's storage */
  function readPhoto(file, cb) {
    if (!file || !/^image\//.test(file.type)) { cb(null); return; }
    var fr = new FileReader();
    fr.onload = function () {
      var img = new Image();
      img.onload = function () {
        var N = 96, side = Math.min(img.width, img.height) || 1, sx = (img.width - side) / 2, sy = (img.height - side) / 2;
        var c = document.createElement("canvas"); c.width = N; c.height = N;
        var x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, N, N); x.drawImage(img, sx, sy, side, side, 0, 0, N, N);
        try { cb(okImg(c.toDataURL("image/jpeg", 0.6)) || null); } catch (e) { cb(null); }
      };
      img.onerror = function () { cb(null); };
      img.src = fr.result;
    };
    fr.onerror = function () { cb(null); };
    fr.readAsDataURL(file);
  }
  /* a receipt is kept small (about 480 px, under 45 KB) so many of them still fit on the phone */
  function readReceipt(file, cb) {
    if (!file || !/^image\//.test(file.type)) { cb(null); return; }
    var fr = new FileReader();
    fr.onload = function () {

      img.onload = function () {
        var out = "", tries = [[480, 0.5], [380, 0.45], [300, 0.4]];
        for (var i = 0; i < tries.length && !out; i++) {
          var k = Math.min(1, tries[i][0] / Math.max(img.width, img.height, 1)), w = Math.max(1, Math.round(img.width * k)), h = Math.max(1, Math.round(img.height * k));
          var c = document.createElement("canvas"); c.width = w; c.height = h;
          var x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, w, h); x.drawImage(img, 0, 0, w, h);
          try { out = okRc(c.toDataURL("image/jpeg", tries[i][1])); } catch (e) { out = ""; }
        }
        cb(out || null);
      };

    };

    fr.readAsDataURL(file);

  /* ---------- backup as PDF ----------
     Page 1 is readable. The following pages hold the data as small lines of text, "SR1|C|<n>|<base64>",
     (gzip-compressed JSON when the browser supports it) with a header line carrying the part count and a checksum.
     Restoring reads those lines back out of the PDF, so it only works with PDFs made here. */

  function hash(str) { var h = 2166136261; for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(16); }

    var s = new Ctor(fmt), w = s.writable.getWriter();

    return new Response(s.readable).arrayBuffer().then(function (b) { return new Uint8Array(b); });
  }
  function packBackup() {
    var raw = new TextEncoder().encode(JSON.stringify(ROOT));

      : Promise.resolve({m: "raw", b: raw});

  }

  /* cb(errorText) or cb(null, parsedBackup) */
  function readBackupPDF(file, cb) {
    var fr = new FileReader();
    fr.onerror = function () { cb("Could not read that file."); };
    fr.onload = function () {
      var txt = new TextDecoder("latin1").decode(new Uint8Array(fr.result));
      var h = /\(SR1\|H\|(gz|raw)\|(\d+)\|([0-9a-f]+)\)\s*Tj/.exec(txt);
      if (!h) { cb("This PDF is not a Golden Gates Stock Inventory backup."); return; }
      var n = +h[2], parts = new Array(n), got = 0, m, re = /\(SR1\|C\|(\d+)\|([A-Za-z0-9+\/=]*)\)\s*Tj/g;
      while ((m = re.exec(txt))) { var i = +m[1]; if (i < n && parts[i] === undefined) { parts[i] = m[2]; got++; } }
      if (got !== n) { cb("The backup is incomplete (found " + got + " of " + n + " parts)."); return; }
      var joined = parts.join("");
      if (hash(joined) !== h[3]) { cb("The backup is damaged."); return; }
      var bytes;
      try { bytes = unb64(joined); } catch (e) { cb("The backup is damaged."); return; }
      var done = function (u8) { var s; try { s = JSON.parse(new TextDecoder().decode(u8)); } catch (e) { cb("The backup could not be read."); return; } cb(null, s); };
      if (h[1] === "gz") {
        if (typeof DecompressionStream !== "function") { cb("This phone cannot open compressed backups."); return; }
        streamBytes(bytes, DecompressionStream, "gzip").then(done, function () { cb("The backup is damaged."); });
      } else done(bytes);
    };
    fr.readAsArrayBuffer(file);
  }

  /* ---------- user manual ---------- */
  var MANUAL = {"en": [["What this app is", [["p", "Golden Gates Stock Inventory keeps a true daily record of your stock, sales, debts and money on your phone, even with no internet. Used honestly every day, it gives you tidy stock control now and a clear, dated business history that can support a visa application later."]], 0], ["1. Install and activate", [["p", "The app is a website you add to your home screen. No app store is needed, and once installed it works offline."], ["p", "**Android (Chrome)**"], ["ol", ["Open the install link in Chrome.", "Tap the menu (3 dots, top right).", "Tap Install app (or Add to Home screen).", "Open the app from its new icon."]], ["p", "**iPhone (Safari only)**"], ["ol", ["Open the install link in Safari, not Chrome and not inside WhatsApp.", "Tap the Share button.", "Scroll down, tap Add to Home Screen, then Add.", "Always open the app from its Home Screen icon, so Safari does not clear your data."]], ["p", "The first time, if the link is slow or does not open, try a VPN or another network. After it is installed you no longer need internet to use it."], ["p", "**Activate your licence.** New phones get a free trial. To continue, open Settings, then Licence, and copy your phone code (6 characters). Send it to your seller on WhatsApp or by call. You receive an activation code: paste it in the same screen and tap Activate. A code works on that phone only, for the time you paid for."]], 0], ["2. Set up your business", [["p", "Open Settings once, before your first sale. Ten minutes here makes every report and invoice look professional."], ["ul", ["**Business name, town and currency.** They appear on every report and invoice.", "**Logo.** Add your logo so invoices carry it.", "**Invoice details.** Enter your address, phone or email, tax or business ID, payment details (bank or mobile money), the days customers have to pay, and a note for the bottom of invoices.", "**Tax.** Set your tax rate, and say whether it is already included in your prices or added on top.", "**QR code and total in words.** You can show or hide each one on invoices.", "**PIN.** Set a PIN so nobody else can open your records.", "**Language.** English and French are available."]]], 0], ["3. Stock keeping, day by day", [["p", "Good stock keeping is one habit: every item that comes in or goes out is recorded the same day. The app then always shows what you really have."], ["p", "**Set up your stock**"], ["ol", ["Go to Stock and add each item with its name, cost, selling price and the quantity you have.", "Add variants (size, colour) when one item comes in several kinds.", "Add a barcode or SKU so you can find the item by scanning.", "For goods that expire, record the expiry date, and set how many days ahead the app warns you.", "If you keep goods in several places (shop, store, warehouse), add each place and the stock of each."]], ["p", "**Every day**"], ["ul", ["Record each purchase and each sale on the day it happens, with the real date. Stock updates by itself.", "Look at the Overview page to see low stock, items near expiry and what is owed.", "Use Barcodes to scan items and print labels."]], ["p", "**Every week or month**"], ["ul", ["Do a stock count: count what is on the shelf and enter it. The app records the difference and the reason, so losses stay visible.", "Move stock between your places instead of editing numbers by hand.", "Open History to see every stock movement and change, with its date."]], ["p", "Never change a quantity just to make it look better. A count that shows a loss is honest, and honest records are what make the history useful."]], 0], ["4. Selling and buying", [["ol", ["Open Orders and tap New sale (or Record a purchase).", "Choose the customer, add items (type a name, SKU or code, or scan a barcode), and set quantity and price.", "Add a service line such as labour or delivery if you charge for it.", "Add a discount or tax if needed.", "Enter what the customer pays now, then complete the order. Stock and profit update by themselves."]], ["p", "**Customers who pay later.** Record each payment in Orders as it arrives. The list Customers owe you shows what is still unpaid, and the same for what you owe suppliers."], ["p", "**Save as a draft** when the goods are not yet released. A draft does not take stock out. It becomes a real sale when you complete it."], ["p", "**When a customer changes their mind.** Use Return items when goods come back. Use Adjust sale when the order changes after release, for example more quantity or an extra service. The stock follows, payments are kept, and every change is logged with its reason."], ["p", "**Other money.** Record business spending under Reports, Expenses, and other money you receive under Other income. Count your cash at closing in the Cash drawer."], ["p", "The real date of every entry matters. Record on the day, not weeks later."]], 0], ["5. Invoices and pro-forma invoices", [["ul", ["**Invoice.** Open a completed sale in Orders and tap Invoice. Choose the invoice date and due date, add a note, and the app numbers it (INV-0001, INV-0002 and so on). It shows your logo, address, payment details, items, services, tax, the total, what was paid and the balance due.", "**Amount in words.** The total is also written in words, on the left of the Total line. You can hide it in Settings.", "**QR code.** Each invoice carries a QR code with a short summary: invoice number, business, date, customer, total, paid, balance and due date. It is a plain summary, not a security seal. You can hide it in Settings.", "**Pro-forma invoice.** When a customer wants a bill before paying, save the sale as a draft and send it as a pro-forma. No stock leaves until you complete the sale after payment.", "**Share.** Save the invoice as a PDF, send it on WhatsApp, or copy the text.", "**Invoices list.** Open Invoices in Orders to see which are unpaid, part paid, overdue or paid, and export the list."]]], 0], ["6. Using the app for a visa application", [["p", "Embassies and visa officers look for a business that is real, active and steady over many months. Regular, dated records of stock, sales, expenses and profit give you organised evidence of that activity. They do not replace the documents an embassy asks for, and no app can promise a visa: the decision is always the embassy's."], ["p", "**The one rule: record only what really happened.** Enter real items, real sales, real prices and real payments, on the real day. Never invent, change or backdate records to make a business look bigger, older or busier than it is. Made-up records can lead to refusal, a ban or legal action, and they fall apart when an officer asks a simple question about your business."], ["p", "**Start early and be regular.** A history of 6 to 12 months of daily records is far more convincing than a few weeks entered at the last minute. Use the app every working day."], ["p", "**What to save each month**"], ["table", [["What", "Where in the app", "How often"], ["Sales report (PDF or Excel)", "Reports", "Monthly"], ["Expenses", "Reports, Expenses", "Monthly"], ["Other income", "Reports, Other income", "Monthly"], ["Cash drawer", "Reports, Cash drawer", "Monthly"], ["Invoices list", "Orders, Invoices", "Monthly"], ["Stock list and stock counts", "Stock", "Monthly"], ["PDF backup of everything", "Settings, Backup", "Weekly"]]], ["p", "**What to bring with the reports.** Your bank or mobile money statements, your business registration and tax papers, supplier and customer receipts, and photos of your shop or warehouse. Your app records show the day-to-day activity, and these documents show where the money came from and went to."], ["p", "**Be ready to explain.** Know your main products, suppliers, customers and typical month. If your records are yours, you will answer easily."]], 1], ["7. Reports, backups and several phones", [["ul", ["**Visa evidence pack.** In Reports, Documents, tap Visa evidence pack to get the business history, sales report, money by method, orders, invoices, expenses, other income, cash drawer and stock list for the chosen period in one PDF. **Money by method** shows what came in and went out as cash, mobile money, bank and gateway.", "**Travel and visa.** On the home screen, My application holds your application checklist, document expiry dates (passport and permits, with a warning 90 days ahead), appointments (reminded 7 days ahead), a travel savings tracker, a trip budget and a foreign currency rate. This information stays on your phone and in your backups, and is not synced. In Reports, Documents you also find the Funds summary, the Income statement (with a line to sign) and the Business summary letter, a draft built from your real records that you read, correct and sign yourself. If you set a foreign currency rate, reports also show sales and profit in that currency.", "**Business profile.** A one-page overview for the chosen period: months of records, average monthly sales, customers, suppliers and stock. It opens the visa evidence pack. **Top customers and suppliers** ranks who you sell to and buy from the most. **Loss and damage** lists stock lost to damage, loss, expiry and low counts, by month, with the value.", "**Monthly goal.** Set a monthly sales goal in Settings and a progress bar shows on the home screen. In Settings you can also choose how many days quotes and proformas stay valid.", "**Contact tags and repeat sale.** Tag a contact as Wholesale, Regular, New or VIP and filter the list. When you start a sale for a known customer, Repeat last sale fills in the items of their last order.", "**Best and slow sellers.** A report of your top 10 profit makers and the items in stock that have not sold for 60 days. **Stock value by month** shows how your stock value changed, worked back from today.", "**Receipt photos.** When you add an expense you can attach a small photo of the receipt (up to 40). It is shown when you open the expense and kept with your records.", "**Month-end closing.** In Reports, Documents, Month-end closing is a four-step checklist: count stock, count cash, save the evidence pack and save a backup. A bar reminds you at the end and start of each month.", "**Daily reminder.** After 3 pm, if nothing is recorded today, a bar reminds you to keep your run of days going.", "**Small PDFs.** In Settings you can choose Small PDFs (no logo) so files are easier to send on WhatsApp.", "**Backup reminder.** If you have not saved a backup for 7 days, a bar on the home screen reminds you.", "**Business history.** In Reports, Documents, tap Business history for a month-by-month PDF of your sales, profit and expenses since your first record. It is a good summary to bring with your other documents.", "**Reorder list.** Needs restocking lists what is low. Send the whole list, or one supplier's part, on WhatsApp.", "**Saved services.** Services you type on an order (labour, delivery) are remembered. Tap one to add it again, or edit the list in Settings, Saved services.", "**Activity.** The home screen counts your days in a row with records.", "**Reports.** In Reports, choose a period such as the last 6 or 12 months, then save the Sales report, Expenses, Other income, Invoices and Cash drawer as a PDF or an Excel (CSV) file.", "**Weekly backup.** Save a PDF backup every week in Settings, Backup. Keep a copy outside your phone, for example sent to yourself on WhatsApp or email. If you clear the app's data or change phone, a backup is how you restore your records.", "**PIN.** Set a PIN in Settings so nobody else can open the app.", "**Several phones.** Turn on sync in Settings to use the same records on more than one phone. Your data is locked with a key on your phone before it is stored.", "**Your data stays yours.** Everything is kept on your phone. The seller cannot see it, and it is not sold or used for advertising.", "**iPhone.** Always open the app from its Home Screen icon so Safari does not delete your data."]]], 0], ["8. Referral bonus, honest use and help", [["p", "**Referral bonus: 20%%.** Your referral code is your phone code. Tap Share the app at the bottom of the home screen to send the install message with your code. When a friend buys a licence and gives your code to the seller, you earn a bonus of 20%% of what they buy. You choose extra time on your licence or cash. Ask your seller for it."], ["p", "**Honest use.** Golden Gates Stock Inventory is made to help you keep a true record of your business. Enter only real information. The seller is not responsible for false or misleading use of the app."], ["p", "**Jobs abroad and some schools.** The link at the bottom of the home screen opens a guide to jobs and schools abroad. It needs internet."]], 0]], "fr": [["Ce qu'est cette application", [["p", "Golden Gates Stock Inventory tient chaque jour un registre fidèle de votre stock, de vos ventes, de vos dettes et de votre argent sur votre téléphone, même sans internet. Utilisée honnêtement chaque jour, elle vous donne un stock bien tenu dès maintenant et un historique d'activité clair et daté qui peut appuyer une demande de visa plus tard."]], 0], ["1. Installer et activer", [["p", "L'application est un site que vous ajoutez à l'écran d'accueil. Aucune boutique d'applications n'est nécessaire, et une fois installée elle fonctionne sans internet."], ["p", "**Android (Chrome)**"], ["ol", ["Ouvrez le lien d'installation dans Chrome.", "Touchez le menu (3 points, en haut à droite).", "Touchez Installer l'application (ou Ajouter à l'écran d'accueil).", "Ouvrez l'application depuis sa nouvelle icône."]], ["p", "**iPhone (Safari uniquement)**"], ["ol", ["Ouvrez le lien d'installation dans Safari, pas Chrome et pas dans WhatsApp.", "Touchez le bouton Partager.", "Faites défiler, touchez Sur l'écran d'accueil, puis Ajouter.", "Ouvrez toujours l'application depuis son icône de l'écran d'accueil, pour que Safari n'efface pas vos données."]], ["p", "La première fois, si le lien est lent ou ne s'ouvre pas, essayez un VPN ou un autre réseau. Une fois installée, vous n'avez plus besoin d'internet pour l'utiliser."], ["p", "**Activer votre licence.** Les nouveaux téléphones ont un essai gratuit. Pour continuer, ouvrez Réglages, puis Licence, et copiez votre code téléphone (6 caractères). Envoyez-le à votre vendeur par WhatsApp ou par appel. Vous recevez un code d'activation : collez-le dans le même écran et touchez Activer. Un code fonctionne sur ce téléphone seulement, pour la durée payée."]], 0], ["2. Configurer votre entreprise", [["p", "Ouvrez Réglages une fois, avant votre première vente. Dix minutes ici rendent tous vos rapports et factures professionnels."], ["ul", ["**Nom de l'entreprise, ville et devise.** Ils apparaissent sur chaque rapport et facture.", "**Logo.** Ajoutez votre logo pour qu'il figure sur les factures.", "**Détails de facture.** Saisissez votre adresse, téléphone ou e-mail, numéro fiscal ou d'entreprise, détails de paiement (banque ou mobile money), les jours accordés aux clients pour payer, et une note pour le bas des factures.", "**Taxe.** Réglez votre taux de taxe et indiquez s'il est déjà inclus dans vos prix ou ajouté en plus.", "**Code QR et total en lettres.** Vous pouvez afficher ou masquer chacun sur les factures.", "**PIN.** Définissez un PIN pour que personne d'autre n'ouvre vos données.", "**Langue.** Anglais et français sont disponibles."]]], 0], ["3. Tenir le stock, jour après jour", [["p", "Bien tenir un stock tient en une habitude : chaque article qui entre ou sort est enregistré le jour même. L'application montre alors toujours ce que vous avez vraiment."], ["p", "**Préparer votre stock**"], ["ol", ["Allez dans Stock et ajoutez chaque article avec son nom, son coût, son prix de vente et la quantité en main.", "Ajoutez des variantes (taille, couleur) quand un article existe en plusieurs sortes.", "Ajoutez un code-barres ou une référence pour retrouver l'article en le scannant.", "Pour les produits périssables, enregistrez la date d'expiration et réglez combien de jours avant l'application vous prévient.", "Si vous gardez des produits à plusieurs endroits (boutique, dépôt, entrepôt), ajoutez chaque lieu et son stock."]], ["p", "**Chaque jour**"], ["ul", ["Enregistrez chaque achat et chaque vente le jour même, avec la vraie date. Le stock se met à jour tout seul.", "Regardez la page Aperçu pour voir le stock bas, les articles proches de l'expiration et ce qui est dû.", "Utilisez Codes pour scanner les articles et imprimer des étiquettes."]], ["p", "**Chaque semaine ou mois**"], ["ul", ["Faites un inventaire : comptez ce qui est sur l'étagère et saisissez-le. L'application garde l'écart et le motif, donc les pertes restent visibles.", "Déplacez le stock entre vos lieux au lieu de modifier les chiffres à la main.", "Ouvrez Historique pour voir chaque mouvement et changement de stock, avec sa date."]], ["p", "Ne changez jamais une quantité juste pour que cela paraisse mieux. Un comptage qui montre une perte est honnête, et des écritures honnêtes rendent l'historique utile."]], 0], ["4. Vendre et acheter", [["ol", ["Ouvrez Commandes et touchez Nouvelle vente (ou Enregistrer un achat).", "Choisissez le client, ajoutez les articles (saisissez un nom, une référence ou un code, ou scannez un code-barres) et réglez quantité et prix.", "Ajoutez une ligne de service, comme la main-d'œuvre ou la livraison, si vous la facturez.", "Ajoutez une remise ou une taxe si besoin.", "Saisissez ce que le client paie maintenant, puis terminez la commande. Le stock et le bénéfice se mettent à jour tout seuls."]], ["p", "**Clients qui paient plus tard.** Enregistrez chaque paiement dans Commandes à mesure qu'il arrive. La liste Les clients vous doivent montre ce qui reste impayé, et de même pour ce que vous devez aux fournisseurs."], ["p", "**Enregistrez en brouillon** quand les marchandises ne sont pas encore livrées. Un brouillon ne sort pas de stock. Il devient une vraie vente quand vous le terminez."], ["p", "**Quand un client change d'avis.** Utilisez Retourner des articles quand des marchandises reviennent. Utilisez Modifier la vente quand la commande change après la livraison, par exemple plus de quantité ou un service en plus. Le stock suit, les paiements sont conservés et chaque changement est noté avec son motif."], ["p", "**Autre argent.** Enregistrez les dépenses de l'entreprise sous Rapports, Dépenses, et l'autre argent reçu sous Autres revenus. Comptez votre caisse à la fermeture dans la Caisse."], ["p", "La vraie date de chaque écriture compte. Enregistrez le jour même, pas des semaines plus tard."]], 0], ["5. Factures et factures pro forma", [["ul", ["**Facture.** Ouvrez une vente terminée dans Commandes et touchez Facture. Choisissez la date de facture et l'échéance, ajoutez une note, et l'application la numérote (INV-0001, INV-0002, etc.). Elle montre votre logo, votre adresse, vos détails de paiement, les articles, les services, la taxe, le total, ce qui a été payé et le solde dû.", "**Montant en lettres.** Le total est aussi écrit en lettres, à gauche de la ligne Total. Vous pouvez le masquer dans Réglages.", "**Code QR.** Chaque facture porte un code QR avec un court résumé : numéro de facture, entreprise, date, client, total, payé, solde et échéance. C'est un simple résumé, pas un sceau de sécurité. Vous pouvez le masquer dans Réglages.", "**Facture pro forma.** Quand un client veut une facture avant de payer, enregistrez la vente en brouillon et envoyez-la en pro forma. Aucun stock ne sort avant que vous terminiez la vente après paiement.", "**Partager.** Enregistrez la facture en PDF, envoyez-la sur WhatsApp ou copiez le texte.", "**Liste des factures.** Ouvrez Factures dans Commandes pour voir lesquelles sont impayées, partiellement payées, en retard ou payées, et exporter la liste."]]], 0], ["6. Utiliser l'application pour une demande de visa", [["p", "Les ambassades et les agents de visa cherchent une activité réelle, active et régulière sur de nombreux mois. Des écritures régulières et datées du stock, des ventes, des dépenses et du bénéfice vous donnent une preuve organisée de cette activité. Elles ne remplacent pas les documents que demande une ambassade, et aucune application ne peut promettre un visa : la décision revient toujours à l'ambassade."], ["p", "**La seule règle : n'enregistrez que ce qui s'est vraiment passé.** Saisissez de vrais articles, de vraies ventes, de vrais prix et de vrais paiements, au vrai jour. N'inventez, ne modifiez et n'antidatez jamais des écritures pour faire paraître une activité plus grande, plus ancienne ou plus occupée qu'elle ne l'est. Des écritures inventées peuvent mener à un refus, une interdiction ou des poursuites, et elles s'effondrent quand un agent pose une simple question sur votre activité."], ["p", "**Commencez tôt et soyez régulier.** Un historique de 6 à 12 mois d'écritures quotidiennes est bien plus convaincant que quelques semaines saisies à la dernière minute. Utilisez l'application chaque jour de travail."], ["p", "**À enregistrer chaque mois**"], ["table", [["Quoi", "Où dans l'application", "Fréquence"], ["Rapport des ventes (PDF ou Excel)", "Rapports", "Chaque mois"], ["Dépenses", "Rapports, Dépenses", "Chaque mois"], ["Autres revenus", "Rapports, Autres revenus", "Chaque mois"], ["Caisse", "Rapports, Caisse", "Chaque mois"], ["Liste des factures", "Commandes, Factures", "Chaque mois"], ["Liste du stock et inventaires", "Stock", "Chaque mois"], ["Sauvegarde PDF de tout", "Réglages, Sauvegarde", "Chaque semaine"]]], ["p", "**À apporter avec les rapports.** Vos relevés bancaires ou de mobile money, votre enregistrement d'entreprise et vos papiers fiscaux, les reçus de fournisseurs et de clients, et des photos de votre boutique ou entrepôt. Vos données de l'application montrent l'activité au jour le jour, et ces documents montrent d'où l'argent est venu et où il est allé."], ["p", "**Soyez prêt à expliquer.** Connaissez vos principaux produits, fournisseurs, clients et un mois typique. Si vos écritures sont les vôtres, vous répondrez facilement."]], 1], ["7. Rapports, sauvegardes et plusieurs téléphones", [["ul", ["**Dossier de preuves visa.** Dans Rapports, Documents, touchez Visa evidence pack pour obtenir en un seul PDF l'historique d'activité, le rapport des ventes, l'argent par moyen de paiement, les commandes, factures, dépenses, autres revenus, la caisse et la liste du stock de la période choisie.", "**Voyage et visa.** Sur l'écran d'accueil, Mon dossier contient votre liste de contrôle, les dates d'expiration des documents (passeport, permis, avertissement 90 jours avant), les rendez-vous (rappel 7 jours avant), un suivi d'épargne voyage, un budget de voyage et un taux de change. Ces informations restent sur votre téléphone et dans vos sauvegardes, sans synchronisation. Dans Rapports, Documents, vous trouvez aussi le Résumé des fonds, le Compte de résultat (avec une ligne de signature) et la Lettre de présentation, un brouillon construit à partir de vos vraies données que vous relisez, corrigez et signez vous-même. Si vous définissez un taux de change, les rapports montrent aussi ventes et bénéfice dans cette devise.", "**Profil de l'entreprise.** Un aperçu d'une page pour la période choisie : mois d'activité, ventes moyennes par mois, clients, fournisseurs et stock. Il ouvre le dossier de preuves visa. **Meilleurs clients et fournisseurs** classe ceux à qui vous vendez et chez qui vous achetez le plus. **Pertes et dégâts** liste le stock perdu (dégâts, perte, péremption, comptage), par mois, avec la valeur.", "**Objectif du mois.** Fixez un objectif de ventes mensuel dans Réglages et une barre de progression s'affiche à l'accueil. Vous pouvez aussi choisir la durée de validité des devis et proformas.", "**Étiquettes et vente répétée.** Étiquetez un contact (Grossiste, Habituel, Nouveau, VIP) et filtrez la liste. Pour un client connu, Répéter la dernière vente remplit les articles de sa dernière commande.", "**Meilleures ventes et ventes lentes.** Un rapport de vos 10 articles les plus rentables et des articles en stock non vendus depuis 60 jours. **Valeur du stock par mois** montre l'évolution de la valeur de votre stock, calculée à partir d'aujourd'hui.", "**Photos de reçus.** En ajoutant une dépense, vous pouvez joindre une petite photo du reçu (jusqu'à 40). Elle s'affiche à l'ouverture de la dépense.", "**Clôture du mois.** Dans Rapports, Documents, Clôture du mois est une liste de quatre étapes : compter le stock, compter la caisse, enregistrer le dossier de preuves et une sauvegarde. Une barre vous le rappelle en fin et début de mois.", "**Rappel quotidien.** Après 15 h, si rien n'est enregistré aujourd'hui, une barre vous rappelle de garder votre série de jours.", "**PDF légers.** Dans Réglages, choisissez PDF petits (sans logo) pour les envoyer plus facilement sur WhatsApp.", "**Rappel de sauvegarde.** Si vous n'avez pas enregistré de sauvegarde depuis 7 jours, une barre sur l'écran d'accueil vous le rappelle.", "**Historique d'activité.** Dans Rapports, Documents, touchez Business history pour un PDF mois par mois de vos ventes, bénéfices et dépenses depuis votre première écriture.", "**Liste de réapprovisionnement.** À réapprovisionner liste ce qui est bas. Envoyez toute la liste, ou la part d'un fournisseur, sur WhatsApp.", "**Services enregistrés.** Les services saisis sur une commande (main-d'œuvre, livraison) sont mémorisés. Touchez-en un pour le rajouter, ou modifiez la liste dans Réglages, Services enregistrés.", "**Activité.** L'écran d'accueil compte vos jours de suite avec des écritures.", "**Rapports.** Dans Rapports, choisissez une période, par exemple les 6 ou 12 derniers mois, puis enregistrez le rapport des ventes, les dépenses, les autres revenus, les factures et la caisse en PDF ou en fichier Excel (CSV).", "**Sauvegarde hebdomadaire.** Enregistrez une sauvegarde PDF chaque semaine dans Réglages, Sauvegarde. Gardez une copie hors de votre téléphone, par exemple envoyée à vous-même sur WhatsApp ou par e-mail. Si vous effacez les données de l'application ou changez de téléphone, une sauvegarde sert à restaurer vos données.", "**PIN.** Définissez un PIN dans Réglages pour que personne d'autre n'ouvre l'application.", "**Plusieurs téléphones.** Activez la synchronisation dans Réglages pour utiliser les mêmes données sur plusieurs téléphones. Vos données sont verrouillées par une clé sur votre téléphone avant d'être stockées.", "**Vos données restent à vous.** Tout est gardé sur votre téléphone. Le vendeur ne peut pas les voir, et elles ne sont ni vendues ni utilisées pour la publicité.", "**iPhone.** Ouvrez toujours l'application depuis son icône de l'écran d'accueil pour que Safari n'efface pas vos données."]]], 0], ["8. Bonus de parrainage, usage honnête et aide", [["p", "**Bonus de parrainage : 20 %%.** Votre code de parrainage est votre code téléphone. Touchez Partager l'application en bas de l'écran d'accueil pour envoyer le message d'installation avec votre code. Quand un ami achète une licence et donne votre code au vendeur, vous gagnez un bonus de 20 %% de son achat. Vous choisissez du temps en plus sur votre licence ou de l'argent. Demandez-le à votre vendeur."], ["p", "**Usage honnête.** Golden Gates Stock Inventory est conçue pour vous aider à tenir un registre fidèle de votre activité. Saisissez uniquement des informations réelles. Le vendeur n'est pas responsable d'un usage faux ou trompeur de l'application."], ["p", "**Emplois à l'étranger et quelques écoles.** Le lien en bas de l'écran d'accueil ouvre un guide des emplois et des écoles à l'étranger. Il demande internet."]], 0]]};
  function manualSheet() {
    var d = MANUAL[LANG === "fr" ? "fr" : "en"], bd = function (x) { return esc(x).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>"); }, c = 'style="margin:0 0 8px;color:var(--mute)"', out = "";
    d.forEach(function (sec) {
      var body = "";
      sec[1].forEach(function (b) {
